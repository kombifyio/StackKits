name: stackkit-vault-main
services:
    passbolt:
        image: docker.io/passbolt/passbolt:5.16.0-1-ce-non-root@sha256:1f6aba5b18199809de9aaec17ba1525b88ac75be9390c5fc343b88a9b18f525d
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -100
        deploy:
            resources:
                limits:
                    memory: 1g
                reservations:
                    memory: 256m
        command:
            - /usr/bin/wait-for.sh
            - -t
            - "0"
            - passbolt-mariadb:3306
            - --
            - /docker-entrypoint.sh
        depends_on:
            passbolt-mariadb:
                condition: service_started
        environment:
            DATASOURCES_DEFAULT_DATABASE: passbolt
            DATASOURCES_DEFAULT_HOST: passbolt-mariadb
            DATASOURCES_DEFAULT_PASSWORD: ${STACKKIT_SECRET_PASSBOLT_DATASOURCES_DEFAULT_PASSWORD:?required}
            DATASOURCES_DEFAULT_USERNAME: passbolt
            PASSBOLT_REGISTRATION_PUBLIC: "false"
            PASSBOLT_SSL_FORCE: "false"
        volumes:
            - passbolt-gpg:/etc/passbolt/gpg
            - passbolt-jwt:/etc/passbolt/jwt
        networks:
            - passbolt-internal
            - stackkit-routing
        ports:
            - 127.0.0.1::8080
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
            io.stackkit.remote-listener: "true"
            io.stackkit.route.backend-pool-ref: vault-pool-aaaaaaaaaaaa
            io.stackkit.route.core-module-ref: stackkits-basement-core-runtime
            io.stackkit.route.exposure: remote-private
            io.stackkit.route.health-gate-ref: route-vault
            io.stackkit.route.id: vault-remote-private
            io.stackkit.route.path: /
            io.stackkit.route.port: "443"
            io.stackkit.route.protocol: https
            io.stackkit.route.target-port: "8080"
            io.stackkit.route.tls.issuer-ref: home-ca
            io.stackkit.route.tls.min-version: "1.2"
            io.stackkit.route.tls.mode: terminate-at-edge
            io.stackkit.route.tls.owner-capability-ref: home-tls-owner
            io.stackkit.route.tls.profile-ref: home-tls
            io.stackkit.route.tls.required: "true"
            io.stackkit.route.upstream-protocol: http
            traefik.docker.network: stackkit-basement-core
            traefik.enable: "true"
            traefik.http.routers.stackkit-vault-remote.entrypoints: remote
            traefik.http.routers.stackkit-vault-remote.rule: Host(`vault.home.example`)
            traefik.http.routers.stackkit-vault-remote.service: stackkit-vault
            traefik.http.routers.stackkit-vault.entrypoints: websecure
            traefik.http.routers.stackkit-vault.middlewares: stackkit-access-gate-lan@docker,stackkit-forward-auth@docker
            traefik.http.routers.stackkit-vault.rule: Host(`vault.home.example`)
            traefik.http.routers.stackkit-vault.tls: "true"
            traefik.http.routers.stackkit-vault.tls.certresolver: stackkits
            traefik.http.services.stackkit-vault.loadbalancer.server.port: "8080"
            traefik.http.services.stackkit-vault.loadbalancer.server.scheme: http
    passbolt-mariadb:
        image: docker.io/library/mariadb:11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -500
        deploy:
            resources:
                limits:
                    memory: 1g
                reservations:
                    memory: 256m
        environment:
            MARIADB_DATABASE: passbolt
            MARIADB_PASSWORD: ${STACKKIT_SECRET_PASSBOLT_MARIADB_MARIADB_PASSWORD:?required}
            MARIADB_ROOT_PASSWORD: ${STACKKIT_SECRET_PASSBOLT_MARIADB_MARIADB_ROOT_PASSWORD:?required}
            MARIADB_USER: passbolt
        volumes:
            - passbolt-mariadb-database:/var/lib/mysql
        networks:
            - passbolt-internal
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 10s
networks:
    passbolt-internal:
        internal: true
    stackkit-routing:
        name: stackkit-basement-core
        external: true
volumes:
    passbolt-gpg: {}
    passbolt-jwt: {}
    passbolt-mariadb-database: {}
