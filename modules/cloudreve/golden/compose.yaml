name: stackkit-files-main
services:
    cloudreve:
        image: docker.io/cloudreve/cloudreve:4.18.0@sha256:f7a464100bf6325e9ba58cb2b0ee60f9a24c58fc2eb90647720bc4b8f3cddd9a
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -100
        deploy:
            resources:
                limits:
                    memory: 1g
                reservations:
                    memory: 128m
        environment:
            CR_SETTING_siteURL: https://files.home.example/
        volumes:
            - cloudreve-data:/cloudreve/data
        networks:
            - cloudreve-internal
            - stackkit-routing
        ports:
            - 127.0.0.1::5212
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
            io.stackkit.remote-listener: "true"
            io.stackkit.route.backend-pool-ref: files-pool-aaaaaaaaaaaa
            io.stackkit.route.core-module-ref: stackkits-basement-core-runtime
            io.stackkit.route.exposure: remote-private
            io.stackkit.route.health-gate-ref: route-files
            io.stackkit.route.id: files-remote-private
            io.stackkit.route.path: /
            io.stackkit.route.port: "443"
            io.stackkit.route.protocol: https
            io.stackkit.route.target-port: "5212"
            io.stackkit.route.tls.issuer-ref: home-ca
            io.stackkit.route.tls.min-version: "1.2"
            io.stackkit.route.tls.mode: terminate-at-edge
            io.stackkit.route.tls.owner-capability-ref: home-tls-owner
            io.stackkit.route.tls.profile-ref: home-tls
            io.stackkit.route.tls.required: "true"
            io.stackkit.route.upstream-protocol: http
            traefik.docker.network: stackkit-basement-core
            traefik.enable: "true"
            traefik.http.routers.stackkit-files-remote.entrypoints: remote
            traefik.http.routers.stackkit-files-remote.rule: Host(`files.home.example`)
            traefik.http.routers.stackkit-files-remote.service: stackkit-files
            traefik.http.routers.stackkit-files.entrypoints: websecure
            traefik.http.routers.stackkit-files.middlewares: stackkit-access-gate-lan@docker,stackkit-forward-auth@docker
            traefik.http.routers.stackkit-files.rule: Host(`files.home.example`)
            traefik.http.routers.stackkit-files.tls: "true"
            traefik.http.routers.stackkit-files.tls.certresolver: stackkits
            traefik.http.services.stackkit-files.loadbalancer.server.port: "5212"
            traefik.http.services.stackkit-files.loadbalancer.server.scheme: http
networks:
    cloudreve-internal:
        internal: true
    stackkit-routing:
        name: stackkit-basement-core
        external: true
volumes:
    cloudreve-data: {}
