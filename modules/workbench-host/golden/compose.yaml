name: stackkit-dev-main
services:
    workbench-host:
        image: docker.io/library/python:3.14.10-trixie@sha256:8e4ff723e809a8e3bbd61bdceb92e9031689ad11edccff3306c0b3ebe60704ff
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -100
        deploy:
            resources:
                limits:
                    memory: 4g
                reservations:
                    memory: 512m
        command:
            - python3
            - -c
            - 'exec("import hashlib, os, pathlib, platform, tarfile, tempfile, urllib.request\nif platform.machine() != \"x86_64\":\n    raise SystemExit(\"Workbench host archive requires linux-x64\")\nclass Redirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        if not newurl.startswith(\"https://\"):\n            raise RuntimeError(\"Release redirect must use HTTPS\")\n        redirected = super().redirect_request(req, fp, code, msg, headers, newurl)\n        redirected.remove_header(\"Authorization\")\n        return redirected\ncache = pathlib.Path(\"/var/cache/workbench-host\")\nif cache.is_symlink():\n    raise RuntimeError(\"Archive cache must not be a symlink\")\ncache.mkdir(exist_ok=True, mode=0o700)\nos.chmod(cache, 0o700)\ndigest_pin = \"1737877513d211db6175c0c1e0537888467d371875e433ea6ada0ee3d9db27df\"\narchive_path = cache / (digest_pin + \".tar.gz\")\nif archive_path.is_symlink():\n    raise RuntimeError(\"Archive cache entry must not be a symlink\")\ntoken_path = os.environ.pop(\"STACKKIT_RELEASE_TOKEN_FILE\")\ndef verified(path):\n    if not path.is_file() or path.stat().st_size > 1073741824:\n        return False\n    with path.open(\"rb\") as cached:\n        return hashlib.file_digest(cached, \"sha256\").hexdigest() == digest_pin\nif not verified(archive_path):\n    for stale in cache.glob(\"tmp*\"):\n        if stale.is_file() and not stale.is_symlink():\n            stale.unlink()\n    opener = urllib.request.build_opener(Redirect())\n    req = urllib.request.Request(\"https://api.github.com/repositories/1347582990/releases/assets/730476591\", headers={\"Accept\": \"application/octet-stream\", \"Authorization\": \"Bearer \" + pathlib.Path(token_path).read_text().strip(), \"User-Agent\": \"stackkits-workbench-host\"})\n    download = tempfile.NamedTemporaryFile(dir=cache, delete=False)\n    try:\n        with download, opener.open(req, timeout=60) as response:\n            size = 0\n            while chunk := response.read(1048576):\n                size += len(chunk)\n                if size > 1073741824:\n                    raise RuntimeError(\"Archive exceeds 1 GiB\")\n                download.write(chunk)\n        candidate = pathlib.Path(download.name)\n        if not verified(candidate):\n            raise RuntimeError(\"Published Workbench archive digest mismatch\")\n        os.replace(candidate, archive_path)\n    finally:\n        pathlib.Path(download.name).unlink(missing_ok=True)\nwith archive_path.open(\"rb\") as archive:\n    if hashlib.file_digest(archive, \"sha256\").hexdigest() != digest_pin:\n        raise RuntimeError(\"Published Workbench archive digest mismatch\")\n    archive.seek(0)\n    with tarfile.open(fileobj=archive, mode=\"r:gz\") as payload:\n        payload.extractall(\"/opt/workbench-host\", filter=\"data\")\nroot = pathlib.Path(\"/opt/workbench-host/kombify-workbench-host-cloud-0.3.4-linux-x64\")\nstate = pathlib.Path(\"/var/lib/workbench-host\")\nfor name in (\"home\", \"workspace\", \"bin\"):\n    directory = state / name\n    if directory.is_symlink():\n        raise RuntimeError(\"Workbench state directory must not be a symlink\")\n    directory.mkdir(exist_ok=True, mode=0o700)\n    os.chmod(directory, 0o700)\n    os.chown(directory, 10000, 10000)\nos.setgroups([])\nos.setgid(10000)\nos.setuid(10000)\nos.environ.update(HOME=str(state / \"home\"), PATH=str(state / \"bin\") + \":\" + str(root) + \":\" + os.environ[\"PATH\"])\nos.chdir(state / \"workspace\")\nos.execv(str(root / \"t3\"), [str(root / \"t3\"), \"serve\", \"--no-browser\", \"--host\", \"0.0.0.0\", \"--port\", \"3773\"])")'
        volumes:
            - workbench-host-archive-cache:/var/cache/workbench-host
            - workbench-host-state:/var/lib/workbench-host
        networks:
            - stackkit-routing
            - stackkit-workload-egress
            - workbench-host-internal
        ports:
            - 127.0.0.1::3773
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
            io.stackkit.remote-listener: "true"
            io.stackkit.route.backend-pool-ref: workbench-pool-aaaaaaaaaaaa
            io.stackkit.route.core-module-ref: stackkits-basement-core-runtime
            io.stackkit.route.exposure: remote-private
            io.stackkit.route.health-gate-ref: route-workbench
            io.stackkit.route.id: workbench-remote-private
            io.stackkit.route.path: /
            io.stackkit.route.port: "443"
            io.stackkit.route.protocol: https
            io.stackkit.route.target-port: "3773"
            io.stackkit.route.tls.issuer-ref: home-ca
            io.stackkit.route.tls.min-version: "1.2"
            io.stackkit.route.tls.mode: terminate-at-edge
            io.stackkit.route.tls.owner-capability-ref: home-tls-owner
            io.stackkit.route.tls.profile-ref: home-tls
            io.stackkit.route.tls.required: "true"
            io.stackkit.route.upstream-protocol: http
            traefik.docker.network: stackkit-basement-core
            traefik.enable: "true"
            traefik.http.routers.stackkit-workbench-remote.entrypoints: remote
            traefik.http.routers.stackkit-workbench-remote.rule: Host(`workbench.home.example`)
            traefik.http.routers.stackkit-workbench-remote.service: stackkit-workbench
            traefik.http.routers.stackkit-workbench.entrypoints: websecure
            traefik.http.routers.stackkit-workbench.middlewares: stackkit-access-gate-lan@docker,stackkit-forward-auth@docker
            traefik.http.routers.stackkit-workbench.rule: Host(`workbench.home.example`)
            traefik.http.routers.stackkit-workbench.tls: "true"
            traefik.http.routers.stackkit-workbench.tls.certresolver: stackkits
            traefik.http.services.stackkit-workbench.loadbalancer.server.port: "3773"
            traefik.http.services.stackkit-workbench.loadbalancer.server.scheme: http
networks:
    stackkit-routing:
        name: stackkit-basement-core
        external: true
    stackkit-workload-egress: {}
    workbench-host-internal:
        internal: true
volumes:
    workbench-host-archive-cache: {}
    workbench-host-state: {}
