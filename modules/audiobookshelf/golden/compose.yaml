name: stackkit-media-main
services:
    audiobookshelf:
        image: ghcr.io/advplyr/audiobookshelf:2.36.1@sha256:3528a93b6442ffe54bd46771bbbab7c97084e1101071586d9dc2254f30bb4358
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -100
        deploy:
            resources:
                limits:
                    memory: 1g
                reservations:
                    memory: 128m
        volumes:
            - audiobookshelf-config:/config
            - audiobookshelf-library:/audiobooks:ro
            - audiobookshelf-metadata:/metadata
        networks:
            - audiobookshelf-internal
            - stackkit-routing
        ports:
            - 127.0.0.1::80
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
            io.stackkit.remote-listener: "true"
            io.stackkit.route.backend-pool-ref: audiobooks-pool-aaaaaaaaaaaa
            io.stackkit.route.core-module-ref: stackkits-basement-core-runtime
            io.stackkit.route.exposure: remote-private
            io.stackkit.route.health-gate-ref: route-audiobooks
            io.stackkit.route.id: audiobooks-remote-private
            io.stackkit.route.path: /
            io.stackkit.route.port: "443"
            io.stackkit.route.protocol: https
            io.stackkit.route.target-port: "80"
            io.stackkit.route.tls.issuer-ref: home-ca
            io.stackkit.route.tls.min-version: "1.2"
            io.stackkit.route.tls.mode: terminate-at-edge
            io.stackkit.route.tls.owner-capability-ref: home-tls-owner
            io.stackkit.route.tls.profile-ref: home-tls
            io.stackkit.route.tls.required: "true"
            io.stackkit.route.upstream-protocol: http
            traefik.docker.network: stackkit-basement-core
            traefik.enable: "true"
            traefik.http.routers.stackkit-audiobooks-remote.entrypoints: remote
            traefik.http.routers.stackkit-audiobooks-remote.rule: Host(`audiobooks.home.example`)
            traefik.http.routers.stackkit-audiobooks-remote.service: stackkit-audiobooks
            traefik.http.routers.stackkit-audiobooks.entrypoints: websecure
            traefik.http.routers.stackkit-audiobooks.middlewares: stackkit-access-gate-lan@docker,stackkit-forward-auth@docker
            traefik.http.routers.stackkit-audiobooks.rule: Host(`audiobooks.home.example`)
            traefik.http.routers.stackkit-audiobooks.tls: "true"
            traefik.http.routers.stackkit-audiobooks.tls.certresolver: stackkits
            traefik.http.services.stackkit-audiobooks.loadbalancer.server.port: "80"
            traefik.http.services.stackkit-audiobooks.loadbalancer.server.scheme: http
networks:
    audiobookshelf-internal:
        internal: true
    stackkit-routing:
        name: stackkit-basement-core
        external: true
volumes:
    audiobookshelf-config: {}
    audiobookshelf-library: {}
    audiobookshelf-metadata: {}
