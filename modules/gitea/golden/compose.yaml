name: stackkit-dev-main
services:
    gitea:
        image: docker.gitea.com/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -100
        deploy:
            resources:
                limits:
                    memory: 2g
                reservations:
                    memory: 256m
        command:
            - /bin/sh
            - -ec
            - gitea -c "$$GITEA_APP_INI" migrate && users=$$(gitea -c "$$GITEA_APP_INI" admin user list) && owner=$$(printf '%s\n' "$$users" | awk '$$1 ~ /^[0-9]+$$/ && $$2 == "owner" {print $$3 " " $$4 " " $$5}') && if [ -n "$$owner" ]; then [ "$$owner" = "$$STACKKITS_OWNER_EMAIL true true" ] || { echo 'Existing Gitea owner does not match local custody' >&2; exit 1; }; else count=$$(printf '%s\n' "$$users" | awk '$$1 ~ /^[0-9]+$$/ {n++} END {print n+0}'); [ "$$count" = 0 ] || { echo 'Existing Gitea users require explicit owner reconciliation' >&2; exit 1; }; password=$$(cat "$$STACKKITS_OWNER_PASSWORD_FILE"); gitea -c "$$GITEA_APP_INI" admin user create --username owner --email "$$STACKKITS_OWNER_EMAIL" --password "$$password" --admin --must-change-password=false; fi && exec gitea -c "$$GITEA_APP_INI" web
        environment:
            GITEA__actions__ENABLED: "false"
            GITEA__database__DB_TYPE: sqlite3
            GITEA__database__PATH: /var/lib/gitea/data/gitea.db
            GITEA__repository__DEFAULT_PRIVATE: private
            GITEA__repository__FORCE_PRIVATE: "true"
            GITEA__security__INSTALL_LOCK: "true"
            GITEA__security__REVERSE_PROXY_LIMIT: "0"
            GITEA__server__DISABLE_SSH: "true"
            GITEA__service__DISABLE_REGISTRATION: "true"
            GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
        volumes:
            - gitea-config:/etc/gitea
            - gitea-data:/var/lib/gitea
        networks:
            - gitea-internal
            - stackkit-routing
        ports:
            - 127.0.0.1::3000
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
            io.stackkit.remote-listener: "true"
            io.stackkit.route.backend-pool-ref: git-pool-aaaaaaaaaaaa
            io.stackkit.route.core-module-ref: stackkits-basement-core-runtime
            io.stackkit.route.exposure: remote-private
            io.stackkit.route.health-gate-ref: route-git
            io.stackkit.route.id: git-remote-private
            io.stackkit.route.path: /
            io.stackkit.route.port: "443"
            io.stackkit.route.protocol: https
            io.stackkit.route.target-port: "3000"
            io.stackkit.route.tls.issuer-ref: home-ca
            io.stackkit.route.tls.min-version: "1.2"
            io.stackkit.route.tls.mode: terminate-at-edge
            io.stackkit.route.tls.owner-capability-ref: home-tls-owner
            io.stackkit.route.tls.profile-ref: home-tls
            io.stackkit.route.tls.required: "true"
            io.stackkit.route.upstream-protocol: http
            traefik.docker.network: stackkit-basement-core
            traefik.enable: "true"
            traefik.http.routers.stackkit-git-remote.entrypoints: remote
            traefik.http.routers.stackkit-git-remote.rule: Host(`git.home.example`)
            traefik.http.routers.stackkit-git-remote.service: stackkit-git
            traefik.http.routers.stackkit-git.entrypoints: websecure
            traefik.http.routers.stackkit-git.middlewares: stackkit-access-gate-lan@docker,stackkit-forward-auth@docker
            traefik.http.routers.stackkit-git.rule: Host(`git.home.example`)
            traefik.http.routers.stackkit-git.tls: "true"
            traefik.http.routers.stackkit-git.tls.certresolver: stackkits
            traefik.http.services.stackkit-git.loadbalancer.server.port: "3000"
            traefik.http.services.stackkit-git.loadbalancer.server.scheme: http
networks:
    gitea-internal:
        internal: true
    stackkit-routing:
        name: stackkit-basement-core
        external: true
volumes:
    gitea-config: {}
    gitea-data: {}
