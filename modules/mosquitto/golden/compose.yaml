name: stackkit-smart-home-main
services:
    mosquitto:
        image: docker.io/library/eclipse-mosquitto:2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -100
        deploy:
            resources:
                limits:
                    memory: 128m
                reservations:
                    memory: 32m
        command:
            - /bin/sh
            - -ec
            - printf 'per_listener_settings true\npersistence true\npersistence_location /mosquitto/data/\nlistener 1883\nallow_anonymous false\npassword_file /mosquitto/data/passwd\nlistener 8080\nprotocol http_api\nallow_anonymous true\n' > /mosquitto/data/mosquitto.conf && password=$$(cat "$$MQTT_PASSWORD_FILE") && rm -f /mosquitto/data/passwd && mosquitto_passwd -b -c /mosquitto/data/passwd stackkit "$$password" && chown mosquitto:mosquitto /mosquitto/data/mosquitto.conf /mosquitto/data/passwd && exec mosquitto -c /mosquitto/data/mosquitto.conf
        volumes:
            - mosquitto-data:/mosquitto/data
        networks:
            - mosquitto-internal
            - stackkit-workload-health
        ports:
            - 127.0.0.1::8080
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
networks:
    mosquitto-internal:
        internal: true
    stackkit-workload-health: {}
volumes:
    mosquitto-data: {}
