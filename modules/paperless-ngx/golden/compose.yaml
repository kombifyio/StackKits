name: stackkit-documents-main
services:
    paperless:
        image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -100
        deploy:
            resources:
                limits:
                    memory: 2g
                reservations:
                    memory: 768m
        depends_on:
            paperless-postgres:
                condition: service_started
            paperless-valkey:
                condition: service_started
        environment:
            PAPERLESS_ADMIN_PASSWORD: ${STACKKIT_SECRET_PAPERLESS_PAPERLESS_ADMIN_PASSWORD:?required}
            PAPERLESS_ADMIN_USER: owner
            PAPERLESS_DBENGINE: postgresql
            PAPERLESS_DBHOST: paperless-postgres
            PAPERLESS_DBNAME: paperless
            PAPERLESS_DBPASS: ${STACKKIT_SECRET_PAPERLESS_PAPERLESS_DBPASS:?required}
            PAPERLESS_DBUSER: paperless
            PAPERLESS_REDIS: redis://paperless-valkey:6379
            PAPERLESS_SECRET_KEY: ${STACKKIT_SECRET_PAPERLESS_PAPERLESS_SECRET_KEY:?required}
        volumes:
            - paperless-consume:/usr/src/paperless/consume
            - paperless-data:/usr/src/paperless/data
            - paperless-export:/usr/src/paperless/export
            - paperless-media:/usr/src/paperless/media
        networks:
            - paperless-internal
            - stackkit-routing
        ports:
            - 127.0.0.1::8000
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
            io.stackkit.remote-listener: "true"
            io.stackkit.route.backend-pool-ref: documents-pool-aaaaaaaaaaaa
            io.stackkit.route.core-module-ref: stackkits-basement-core-runtime
            io.stackkit.route.exposure: remote-private
            io.stackkit.route.health-gate-ref: route-documents
            io.stackkit.route.id: documents-remote-private
            io.stackkit.route.path: /
            io.stackkit.route.port: "443"
            io.stackkit.route.protocol: https
            io.stackkit.route.target-port: "8000"
            io.stackkit.route.tls.issuer-ref: home-ca
            io.stackkit.route.tls.min-version: "1.2"
            io.stackkit.route.tls.mode: terminate-at-edge
            io.stackkit.route.tls.owner-capability-ref: home-tls-owner
            io.stackkit.route.tls.profile-ref: home-tls
            io.stackkit.route.tls.required: "true"
            io.stackkit.route.upstream-protocol: http
            traefik.docker.network: stackkit-basement-core
            traefik.enable: "true"
            traefik.http.routers.stackkit-documents-remote.entrypoints: remote
            traefik.http.routers.stackkit-documents-remote.rule: Host(`documents.home.example`)
            traefik.http.routers.stackkit-documents-remote.service: stackkit-documents
            traefik.http.routers.stackkit-documents.entrypoints: websecure
            traefik.http.routers.stackkit-documents.middlewares: stackkit-access-gate-lan@docker,stackkit-forward-auth@docker
            traefik.http.routers.stackkit-documents.rule: Host(`documents.home.example`)
            traefik.http.routers.stackkit-documents.tls: "true"
            traefik.http.routers.stackkit-documents.tls.certresolver: stackkits
            traefik.http.services.stackkit-documents.loadbalancer.server.port: "8000"
            traefik.http.services.stackkit-documents.loadbalancer.server.scheme: http
    paperless-postgres:
        image: docker.io/library/postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -500
        deploy:
            resources:
                limits:
                    memory: 1g
                reservations:
                    memory: 384m
        environment:
            POSTGRES_DB: paperless
            POSTGRES_PASSWORD: ${STACKKIT_SECRET_PAPERLESS_POSTGRES_POSTGRES_PASSWORD:?required}
            POSTGRES_USER: paperless
        volumes:
            - paperless-postgres-database:/var/lib/postgresql
        networks:
            - paperless-internal
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
        healthcheck:
            test:
                - CMD
                - pg_isready
                - -U
                - paperless
                - -d
                - paperless
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 10s
    paperless-valkey:
        image: docker.io/valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 10m
        oom_score_adj: -250
        deploy:
            resources:
                limits:
                    memory: 512m
                reservations:
                    memory: 128m
        command:
            - valkey-server
        volumes:
            - paperless-valkey-cache:/data
        networks:
            - paperless-internal
        labels:
            io.stackkit.health-failure: blocking
            io.stackkit.lifecycle: daemon
        healthcheck:
            test:
                - CMD
                - valkey-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 10s
networks:
    paperless-internal:
        internal: true
    stackkit-routing:
        name: stackkit-basement-core
        external: true
volumes:
    paperless-consume: {}
    paperless-data: {}
    paperless-export: {}
    paperless-media: {}
    paperless-postgres-database: {}
    paperless-valkey-cache: {}
