# Registry and read-only migration metadata only.
#
# The Modern Homelab architecture, topology, capabilities, workload choices,
# placement, federation, identity, and execution contracts live exclusively in
# stackfile.cue Definition and the shared Architecture-v2 CUE catalog. This file
# must never select a PaaS, transport, provider, service graph, context, mode,
# add-on, secret implementation, or runtime.
apiVersion: stackkit.catalog/v1alpha1
kind: KitCatalogMetadata

metadata:
  name: modern-homelab
  displayName: "Modern Homelab"
  version: "1.1.0-alpha"
  description: "Federated local and cloud StackKit with a policy-constrained bridge"
  author: "kombify Team"
  license: "Apache-2.0"
  repository: "https://github.com/kombifyio/stackkits"
  # Every mode_matrix.cue cell is scaffolding or unsupported and no native or
  # advanced templates are generated for this kit, so it is not an installable
  # path. It stays in the public export as a declared alpha rather than being
  # hidden, because the federation contracts it defines are real and readable.
  maturity: alpha
  status: scaffolding
  tags:
    - homelab
    - federation
    - home
    - cloud

# Compatibility evidence only; this does not provision or select a host.
supportedOS:
  - ubuntu-24
  - ubuntu-22
  - debian-12
