openapi: 3.1.0
info:
  title: StackAction Contract
  version: "stackkit.stack-action/v1"
  description: Provider-free StackKits action request and evidence contract generated from CUE.
x-kombify-generator-version: "stackactiongen/v1"
x-kombify-source-path: "foundation/stack_action.cue"
x-kombify-source-sha256: "590d0803a54d4c89035fa38d90690b39838ff0d0f895b76c4f7e6006db29d863"
paths:
  /api/v1/internal/stack-actions/stackkit-rollout:
    post:
      operationId: stackActionStackKitRollout
      summary: "Run or dry-run StackKits rollout for TechStack"
      tags: [StackAction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StackActionRequest"
                - type: object
                  properties:
                    action:
                      const: "stackkit_rollout"
      responses:
        "200":
          description: StackAction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackActionResponse"
        "400":
          description: Invalid StackAction request

  /api/v1/internal/stack-actions/stackkit-verify:
    post:
      operationId: stackActionStackKitVerify
      summary: "Verify StackKits rollout state for TechStack"
      tags: [StackAction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StackActionRequest"
                - type: object
                  properties:
                    action:
                      const: "verify_rollout"
      responses:
        "200":
          description: StackAction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackActionResponse"
        "400":
          description: Invalid StackAction request

  /api/v1/internal/stack-actions/restore-drill:
    post:
      operationId: stackActionRestoreDrill
      summary: "Run or dry-run StackKits restore drill for TechStack"
      tags: [StackAction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StackActionRequest"
                - type: object
                  properties:
                    action:
                      const: "restore_drill"
      responses:
        "200":
          description: StackAction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackActionResponse"
        "400":
          description: Invalid StackAction request

  /api/v1/internal/stack-actions/backup-run:
    post:
      operationId: stackActionBackupRun
      summary: "Start a StackKits backup run"
      tags: [StackAction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StackActionRequest"
                - type: object
                  properties:
                    action:
                      const: "backup_run"
      responses:
        "200":
          description: StackAction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackActionResponse"
        "400":
          description: Invalid StackAction request

  /api/v1/internal/stack-actions/backup-status:
    post:
      operationId: stackActionBackupStatus
      summary: "Inspect StackKits backup status"
      tags: [StackAction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StackActionRequest"
                - type: object
                  properties:
                    action:
                      const: "backup_status"
      responses:
        "200":
          description: StackAction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackActionResponse"
        "400":
          description: Invalid StackAction request

  /api/v1/internal/stack-actions/backup-restore:
    post:
      operationId: stackActionBackupRestore
      summary: "Restore a StackKits backup snapshot"
      tags: [StackAction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StackActionRequest"
                - type: object
                  properties:
                    action:
                      const: "backup_restore"
      responses:
        "200":
          description: StackAction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackActionResponse"
        "400":
          description: Invalid StackAction request

  /api/v1/internal/stack-actions/backup-wipe:
    post:
      operationId: stackActionBackupWipe
      summary: "Wipe the configured StackKits backup repository"
      tags: [StackAction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StackActionRequest"
                - type: object
                  properties:
                    action:
                      const: "backup_wipe"
      responses:
        "200":
          description: StackAction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackActionResponse"
        "400":
          description: Invalid StackAction request

  /api/v1/internal/stack-actions/service-start:
    post:
      operationId: stackActionServiceStart
      summary: "Start one StackKits-managed service"
      tags: [StackAction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StackActionRequest"
                - type: object
                  properties:
                    action:
                      const: "service_start"
      responses:
        "200":
          description: StackAction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackActionResponse"
        "400":
