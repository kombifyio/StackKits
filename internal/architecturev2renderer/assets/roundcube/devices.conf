# Governed by StackKits. Device setup documents generated from the owner's
# mailbox endpoints: Mozilla autoconfig, Outlook autodiscover and an Apple
# configuration profile. No password is ever part of a response.
Alias /mail/config-v1.1.xml /usr/local/share/stackkit-mail/devices.php
Alias /.well-known/autoconfig/mail/config-v1.1.xml /usr/local/share/stackkit-mail/devices.php
Alias /autodiscover/autodiscover.xml /usr/local/share/stackkit-mail/devices.php
Alias /Autodiscover/Autodiscover.xml /usr/local/share/stackkit-mail/devices.php
Alias /mail.mobileconfig /usr/local/share/stackkit-mail/devices.php
<Directory /usr/local/share/stackkit-mail>
	Options None
	AllowOverride None
	Require all granted
</Directory>
