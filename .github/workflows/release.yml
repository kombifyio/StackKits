          archive="$(find dist -maxdepth 1 -name 'stackkits-modern-homelab_*_linux_amd64.tar.gz' -print -quit)"
          test -s "$archive"
          expected="$(jq -er '
            [.assets[] | select(.kit=="modern-homelab" and .platform.os=="linux" and .platform.arch=="amd64") | .archive.sha256]
            | unique | if length==1 then .[0] else error("ambiguous Modern archive") end
