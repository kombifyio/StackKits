  modern-terminal-receipt:
    name: Compose exact Modern terminal receipt
    needs: [modern-runtime-e2e, modern-ha-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modern-runtime-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/modern-terminal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modern-ha-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/modern-ha
      - name: Compose and independently validate
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/modern-ha/modern-warm-standby-live-receipt.json artifacts/modern-terminal/
          tree="$(git rev-parse HEAD^{tree})"
          digest="sha256:$(printf '%s\0%s' "$GITHUB_SHA" "$tree" | sha256sum | cut -d' ' -f1)"
          bash scripts/e2e/compose-modern-terminal-live.sh artifacts/modern-terminal \
