name: Public Release Trust and Runtime Gate

on:
  repository_dispatch:
    types:
      - stackkits-release-ready
  workflow_dispatch:
    inputs:
      mode:
        description: Release publication or an exact live-release restore proof
        required: true
        default: release
        type: choice
        options:
          - release
          - restore-proof
      tag:
        description: Exact publisher-created release tag
        required: true
        type: string
      source_commit:
        description: Exact immutable public source commit
        required: true
        type: string

concurrency:
  group: public-release-trust-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.26.5"
  GH_CLI_VERSION: "2.92.0"
  GH_CLI_LINUX_AMD64_SHA256: "b57848131bdf0c229cd35e1f2a51aa718199858b2e728410b37e89a428943ec4"

jobs:
  dispatch-release-ready:
    name: Dispatch exact publisher-ready tag
    if: github.repository == 'kombifyio/StackKits' && github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch exact tag trust execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
          SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|edge)\.[0-9]+)?$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f "tag=$TAG" \
            -f "source_commit=$SOURCE_COMMIT"

  release-trust:
    name: Attest exact release and prove standalone runtime
    if: github.repository == 'kombifyio/StackKits' && github.event_name == 'workflow_dispatch' && inputs.mode != 'restore-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout published tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install pinned GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${GH_CLI_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Verify the publisher-owned immutable draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ] || [ "$GITHUB_SHA" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "::error title=Release dispatch mismatch::Dispatch ref ${GITHUB_REF} at ${GITHUB_SHA} does not match ${TAG} at ${EXPECTED_SOURCE_COMMIT}."
            exit 1
          fi
          release="$(gh release view "$TAG" --json isDraft,assets)"
          test "$(jq -r '.isDraft' <<<"$release")" = "true"
          names="$(jq -r '.assets[].name' <<<"$release")"
          grep -qx 'checksums.txt' <<<"$names"
          grep -qx 'release-evidence.json' <<<"$names"
          grep -Eq '^stackkits-basement-kit_.+_linux_amd64\.tar\.gz$' <<<"$names"
          grep -Eq '^stackkits-basement-kit_.+_linux_amd64\.tar\.gz\.spdx\.json$' <<<"$names"
          gh release download "$TAG" --dir dist --pattern 'checksums.txt' --clobber
          gh release download "$TAG" --dir dist --pattern 'release-evidence.json' --clobber
          jq -e --arg expectedSourceCommit "$EXPECTED_SOURCE_COMMIT" \
            '.release.commit == $expectedSourceCommit and .checks.attestationVerification.status == "pass"' \
            dist/release-evidence.json >/dev/null

      - name: Download exact per-kit archives and SBOMs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir dist --pattern 'stackkits_*.tar.gz' --clobber
          gh release download "$TAG" --dir dist --pattern 'stackkits_*.zip' --clobber
          gh release download "$TAG" --dir dist --pattern 'stackkits_*.spdx.json' --clobber
          gh release download "$TAG" --dir dist --pattern 'stackkits-*.tar.gz' --clobber
          gh release download "$TAG" --dir dist --pattern 'stackkits-*.zip' --clobber
          gh release download "$TAG" --dir dist --pattern 'stackkits-*.spdx.json' --clobber
          (
            cd dist
            sha256sum --ignore-missing --check --strict checksums.txt
          )
          bash scripts/release/validate-release-archives.sh dist
          for archive in dist/stackkits-{basement-kit,cloud-kit,modern-homelab}_*.tar.gz \
            dist/stackkits-{basement-kit,cloud-kit,modern-homelab}_*.zip; do
            test -s "$archive"
            test -s "${archive}.spdx.json"
          done

      - name: Attest exact per-kit release archives
        id: archive-attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/stackkits-basement-kit_*.tar.gz
            dist/stackkits-basement-kit_*.zip
            dist/stackkits-cloud-kit_*.tar.gz
            dist/stackkits-cloud-kit_*.zip
            dist/stackkits-modern-homelab_*.tar.gz
            dist/stackkits-modern-homelab_*.zip
          create-storage-record: false
          show-summary: false

      - name: Materialize offline bundles, trusted roots, and release index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle_root="${RUNNER_TEMP}/archive-bundles"
          mkdir -p "$bundle_root"
          for archive in dist/stackkits-{basement-kit,cloud-kit,modern-homelab}_*.tar.gz \
            dist/stackkits-{basement-kit,cloud-kit,modern-homelab}_*.zip; do
            subject_dir="${bundle_root}/$(basename "$archive")"
            mkdir -p "$subject_dir"
            (
              cd "$subject_dir"
              gh attestation download "$GITHUB_WORKSPACE/$archive" -R "$GITHUB_REPOSITORY"
            )
          done
          find "$bundle_root" -type f -name 'sha256:*.jsonl' -print0 \
            | sort -z \
            | xargs -0 cat \
            | sort -u \
            > dist/stackkits-release-assets.intoto.jsonl
          test -s dist/stackkits-release-assets.intoto.jsonl
          gh attestation trusted-root > dist/sigstore-trusted-root.jsonl
          test -s dist/sigstore-trusted-root.jsonl
          node scripts/release/verify-trusted-root.mjs \
            --policy internal/releaseindex/release-trust-policy.json \
            --trusted-root dist/sigstore-trusted-root.jsonl

          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          node scripts/release/render-release-index.mjs \
            --dist dist \
            --tag "$TAG" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --base-url "https://github.com/kombifyio/stackKits/releases/download/${TAG}" \
            --trusted-root dist/sigstore-trusted-root.jsonl \
            --attestation dist/stackkits-release-assets.intoto.jsonl \
            --certificate-identity "$identity" \
            --output dist/stackkits-release-index-v1.json

          for archive in dist/stackkits-{basement-kit,cloud-kit,modern-homelab}_*.tar.gz \
            dist/stackkits-{basement-kit,cloud-kit,modern-homelab}_*.zip; do
            gh attestation verify "$archive" \
              -R "$GITHUB_REPOSITORY" \
              --bundle dist/stackkits-release-assets.intoto.jsonl \
              --custom-trusted-root dist/sigstore-trusted-root.jsonl
          done
          go test ./internal/releaseindex

      - name: Upload archive trust material to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/stackkits-release-assets.intoto.jsonl \
            dist/sigstore-trusted-root.jsonl \
            dist/stackkits-release-index-v1.json \
            --clobber

      - name: Attest the release index
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/stackkits-release-index-v1.json
          create-storage-record: false
          show-summary: false

      - name: Publish and verify the release-index attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          index_bundle_dir="${RUNNER_TEMP}/index-bundle"
          mkdir -p "$index_bundle_dir"
          (
            cd "$index_bundle_dir"
            gh attestation download \
              "$GITHUB_WORKSPACE/dist/stackkits-release-index-v1.json" \
              -R "$GITHUB_REPOSITORY"
          )
          mapfile -t bundles < <(find "$index_bundle_dir" -type f -name 'sha256:*.jsonl')
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error title=Ambiguous index attestation::Expected one exact index bundle, found ${#bundles[@]}."
            exit 1
          fi
          cp "${bundles[0]}" dist/stackkits-release-index-v1.json.intoto.jsonl
          gh attestation verify dist/stackkits-release-index-v1.json \
            -R "$GITHUB_REPOSITORY" \
            --bundle dist/stackkits-release-index-v1.json.intoto.jsonl \
            --custom-trusted-root dist/sigstore-trusted-root.jsonl
          gh release upload "$TAG" \
            dist/stackkits-release-index-v1.json.intoto.jsonl \
            --clobber

      - name: Hand exact release trust set to the runtime proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-trust-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/stackkits-release-assets.intoto.jsonl
            dist/sigstore-trusted-root.jsonl
            dist/stackkits-release-index-v1.json
            dist/stackkits-release-index-v1.json.intoto.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  runtime-e2e:
    name: Prove exact standalone Basement archive
    needs: release-trust
    if: github.repository == 'kombifyio/StackKits'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout published tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Download exact release trust set from the producing job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-trust-${{ github.ref_name }}-${{ github.sha }}
          path: dist

      - name: Download exact Basement archive and SBOM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern 'stackkits-basement-kit_*_linux_amd64.tar.gz' --clobber
          gh release download "$TAG" --dir dist --pattern 'stackkits-basement-kit_*_linux_amd64.tar.gz.spdx.json' --clobber
          for name in \
            stackkits-release-assets.intoto.jsonl \
            sigstore-trusted-root.jsonl \
            stackkits-release-index-v1.json \
            stackkits-release-index-v1.json.intoto.jsonl; do
            test -s "dist/$name"
          done

      - name: Admit packet capture without a privileged runtime
        shell: bash
        run: sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v tcpdump)"

      - name: Run bounded standalone Basement archive Apply and Verify
        shell: bash
        env:
          STACKKIT_E2E_PRELOAD_IMAGES: "1"
          STACKKIT_E2E_RESTORE_PROOF: "1"
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name 'stackkits-basement-kit_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$archive"
          tree="$(git rev-parse HEAD^{tree})"
          source_digest="sha256:$(printf '%s\0%s' "$GITHUB_SHA" "$tree" | sha256sum | cut -d' ' -f1)"
          mkdir -p artifacts/standalone-runtime
          bash scripts/e2e/run-standalone-oss-runtime-e2e.sh \
            "$archive" \
            "${archive}.spdx.json" \
            dist/stackkits-release-assets.intoto.jsonl \
            dist/sigstore-trusted-root.jsonl \
            dist/stackkits-release-index-v1.json \
            dist/stackkits-release-index-v1.json.intoto.jsonl \
            "$GITHUB_SHA" \
            "$source_digest" \
            artifacts/standalone-runtime
          jq -e \
            '.schemaVersion == "stackkit.restore-live-e2e-evidence/v1"' \
            artifacts/standalone-runtime/restore-live-evidence.json >/dev/null

      - name: Retain sanitized standalone failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-runtime-failure-${{ github.ref_name }}-${{ github.sha }}
          path: |
            artifacts/standalone-runtime/tcpdump.log
            artifacts/standalone-runtime/network-events.jsonl
            artifacts/standalone-runtime/compose-origin-scope.json
            artifacts/standalone-runtime/tcpdump-init.stderr.log
            artifacts/standalone-runtime/tcpdump.stderr.log
            artifacts/standalone-runtime/fixture.log
            artifacts/standalone-runtime/init.log
            artifacts/standalone-runtime/validate.log
            artifacts/standalone-runtime/generate.log
            artifacts/standalone-runtime/release-bootstrap.json
            artifacts/standalone-runtime/apply.log
            artifacts/standalone-runtime/verify.json
            artifacts/standalone-runtime/runtime-evidence.json
            artifacts/standalone-runtime/restore-live-evidence.json
            artifacts/standalone-runtime/restore-proof/*.log
            artifacts/standalone-runtime/restore-proof/*.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1

      - name: Attest exact restore evidence
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: artifacts/standalone-runtime/restore-live-evidence.json
          create-storage-record: false
          show-summary: false

      - name: Attest standalone runtime evidence
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: artifacts/standalone-runtime/runtime-evidence.json
          create-storage-record: false
          show-summary: false

      - name: Retain exact runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-runtime-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/standalone-runtime
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Attach runtime evidence and publish the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != *-beta.* && "$TAG" != *-edge.* ]]; then
            echo "::error title=Stable release gate incomplete::Stable publication requires the S4 upgrade, rollback, backup, and drift receipt."
            exit 1
          fi
          gh release upload "$TAG" \
            artifacts/standalone-runtime/runtime-evidence.json \
            artifacts/standalone-runtime/release-bootstrap.json \
            artifacts/standalone-runtime/network-events.jsonl \
            artifacts/standalone-runtime/compose-origin-scope.json \
            artifacts/standalone-runtime/apply.log \
            artifacts/standalone-runtime/verify.json \
            --clobber
          gh release edit "$TAG" \
            --draft=false \
            --prerelease \
            --latest=false

  restore-proof:
    name: Prove restore against an exact live Basement archive
    if: github.repository == 'kombifyio/StackKits' && github.event_name == 'workflow_dispatch' && inputs.mode == 'restore-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the current public proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install pinned GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${GH_CLI_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Download and verify the exact live release trust set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|edge)\.[0-9]+)?$ ]]
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          tag_source_commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          if [ "$tag_source_commit" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "::error title=Restore proof source mismatch::Tag ${TAG} resolves to ${tag_source_commit}; expected ${EXPECTED_SOURCE_COMMIT}."
            exit 1
          fi

          release="$(gh release view "$TAG" --json tagName,isDraft,assets)"
          jq -e --arg tag "$TAG" \
            '.tagName == $tag and .isDraft == false' <<<"$release" >/dev/null
          names="$(jq -r '.assets[].name' <<<"$release")"
          for required in \
            checksums.txt \
            release-evidence.json \
            stackkits-release-assets.intoto.jsonl \
            sigstore-trusted-root.jsonl \
            stackkits-release-index-v1.json \
            stackkits-release-index-v1.json.intoto.jsonl; do
            grep -qx "$required" <<<"$names"
          done
          test "$(grep -Ec '^stackkits-basement-kit_.+_linux_amd64\.tar\.gz$' <<<"$names")" -eq 1
          test "$(grep -Ec '^stackkits-basement-kit_.+_linux_amd64\.tar\.gz\.spdx\.json$' <<<"$names")" -eq 1

          mkdir -p dist
          for pattern in \
            checksums.txt \
            release-evidence.json \
            stackkits-release-assets.intoto.jsonl \
            sigstore-trusted-root.jsonl \
            stackkits-release-index-v1.json \
            stackkits-release-index-v1.json.intoto.jsonl \
            'stackkits-basement-kit_*_linux_amd64.tar.gz' \
            'stackkits-basement-kit_*_linux_amd64.tar.gz.spdx.json'; do
            gh release download "$TAG" --dir dist --pattern "$pattern" --clobber
          done
          (
            cd dist
            sha256sum --ignore-missing --check --strict checksums.txt
          )

          archive="$(find dist -maxdepth 1 -type f -name 'stackkits-basement-kit_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$archive"
          sbom="${archive}.spdx.json"
          archive_name="$(basename "$archive")"
          sbom_name="$(basename "$sbom")"
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          sbom_sha256="$(sha256sum "$sbom" | cut -d' ' -f1)"
          jq -e \
            --arg tag "$TAG" \
            --arg archiveName "$archive_name" \
            --arg archiveSha256 "$archive_sha256" \
            --arg sbomName "$sbom_name" \
            --arg sbomSha256 "$sbom_sha256" \
            '
              .schemaVersion == "stackkits-release-index/v1" and
              .release.repository == "kombifyio/stackKits" and
              .release.version == $tag and
              ([.assets[] |
                select(
                  .kit == "basement-kit" and
                  .version == $tag and
                  .platform.os == "linux" and
                  .platform.arch == "amd64" and
                  .archive.name == $archiveName and
                  .archive.sha256 == $archiveSha256 and
                  .sbom.name == $sbomName and
                  .sbom.sha256 == $sbomSha256
                )
              ] | length) == 1
            ' dist/stackkits-release-index-v1.json >/dev/null
          jq -e --arg tag "$TAG" --arg commit "$EXPECTED_SOURCE_COMMIT" \
            '.release.tag == $tag and .release.commit == $commit and
             .checks.attestationVerification.status == "pass"' \
            dist/release-evidence.json >/dev/null

          gh attestation verify "$archive" \
            -R "$GITHUB_REPOSITORY" \
            --bundle dist/stackkits-release-assets.intoto.jsonl \
            --custom-trusted-root dist/sigstore-trusted-root.jsonl
          gh attestation verify dist/stackkits-release-index-v1.json \
            -R "$GITHUB_REPOSITORY" \
            --bundle dist/stackkits-release-index-v1.json.intoto.jsonl \
            --custom-trusted-root dist/sigstore-trusted-root.jsonl

      - name: Admit packet capture without a privileged runtime
        shell: bash
        run: sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v tcpdump)"

      - name: Run bounded exact-archive restore proof
        shell: bash
        env:
          STACKKIT_E2E_PRELOAD_IMAGES: "1"
          STACKKIT_E2E_RESTORE_PROOF: "1"
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name 'stackkits-basement-kit_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$archive"
          source_commit="${{ inputs.source_commit }}"
          tree="$(git rev-parse "${source_commit}^{tree}")"
          source_digest="sha256:$(printf '%s\0%s' "$source_commit" "$tree" | sha256sum | cut -d' ' -f1)"
          mkdir -p artifacts/standalone-runtime
          bash scripts/e2e/run-standalone-oss-runtime-e2e.sh \
            "$archive" \
            "${archive}.spdx.json" \
            dist/stackkits-release-assets.intoto.jsonl \
            dist/sigstore-trusted-root.jsonl \
            dist/stackkits-release-index-v1.json \
            dist/stackkits-release-index-v1.json.intoto.jsonl \
            "$source_commit" \
            "$source_digest" \
            artifacts/standalone-runtime
          jq -e \
            '.schemaVersion == "stackkit.restore-live-e2e-evidence/v1"' \
            artifacts/standalone-runtime/restore-live-evidence.json >/dev/null

      - name: Retain sanitized restore failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restore-live-failure-${{ inputs.tag }}-${{ inputs.source_commit }}
          path: |
            artifacts/standalone-runtime/*.log
            artifacts/standalone-runtime/*.json
            artifacts/standalone-runtime/*.jsonl
            artifacts/standalone-runtime/restore-proof/*.log
            artifacts/standalone-runtime/restore-proof/*.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1

      - name: Attest exact restore evidence
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: artifacts/standalone-runtime/restore-live-evidence.json
          create-storage-record: false
          show-summary: false

      - name: Retain exact restore evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restore-live-${{ inputs.tag }}-${{ inputs.source_commit }}
          path: artifacts/standalone-runtime
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
