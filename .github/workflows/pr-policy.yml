name: Pull request policy

# This repository is a generated release mirror: the next release export
# replaces the tree, so a merged pull request would be lost. Explain that on
# every new pull request so contributors know what happens to it.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  notice:
    name: Explain the mirror policy
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file - <<'EOF'
          Thanks for the change. This repository is a generated release mirror: every release replaces the tree with the curated export of the private upstream, so a pull request is not merged here (see `CONTRIBUTING.md`).

          We review it here. If we take it, we import the change upstream with your authorship kept, and this pull request is closed with the commit and the release that carry it; if not, we say why. Sign off your commits (`git commit -s`) under the Developer Certificate of Origin, as `CONTRIBUTING.md` describes.
          EOF
