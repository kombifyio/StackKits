name: Publish Release Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published release tag
        required: true
        type: string

concurrency:
  group: public-release-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  publish-image:
    name: Publish StackKit Server image
    if: github.repository == 'kombifyio/StackKits'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate exact published tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|edge)\.[0-9]+)?$ ]]

      - name: Checkout published tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact tag
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/kombifyio/stackkits
        run: |
          set -euo pipefail
          stable_args=()
          if [[ "$TAG" != *-* ]]; then stable_args+=(--tag "${IMAGE}:latest"); fi
          docker buildx build \
            --push \
            --tag "${IMAGE}:${TAG}" \
            "${stable_args[@]}" \
            .
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/kombifyio/stackkits
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
