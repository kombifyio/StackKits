name: Publish Release Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published release tag
        required: true
        type: string

concurrency:
  group: public-release-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  publish-image:
    name: Publish StackKit Server image
    if: github.repository == 'kombifyio/StackKits'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate exact published tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|edge)\.[0-9]+)?$ ]]

      - name: Checkout published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact tag
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/kombifyio/stackkits
        run: |
          set -euo pipefail
          stable_args=()
          if [[ "$TAG" != *-* ]]; then stable_args+=(--tag "${IMAGE}:latest"); fi
          docker buildx build \
            --push \
            --tag "${IMAGE}:${TAG}" \
            "${stable_args[@]}" \
            .
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/kombifyio/stackkits
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
