name: Publish Release Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published release tag
        required: true
        type: string

concurrency:
  group: public-release-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  publish-image:
    name: Publish StackKit Server image
    # Channel prereleases (internal Nightly vX.Y.Z-preview.<date>.<sha> and
    # Early Access vX.Y.Z-early-access.<date>.<sha>) publish no image.
    if: github.repository == 'kombifyio/StackKits' && !contains(github.event.release.tag_name || inputs.tag, '-preview.') && !contains(github.event.release.tag_name || inputs.tag, '-early-access.')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate exact published tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|edge)\.[0-9]+)?$ ]]

      - name: Checkout published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact tag
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/kombifyio/stackkits
        run: |
          set -euo pipefail
          version="${TAG#v}"
          commit="$(git rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          stable_args=()
          if [[ "$TAG" != *-* ]]; then stable_args+=(--tag "${IMAGE}:latest"); fi
          docker buildx build \
            --push \
            --build-arg "VERSION=${version}" \
            --build-arg "GIT_COMMIT=${commit}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --tag "${IMAGE}:${TAG}" \
            "${stable_args[@]}" \
            .
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kombifyio/stackkits
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true


  pocketid-platform:
    name: Build and qualify PocketID CAS (${{ matrix.arch }})
    needs: publish-image
    if: github.repository == 'kombifyio/StackKits' && !contains(github.event.release.tag_name || inputs.tag, '-preview.')
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      POCKETID_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - name: Resolve the locked real protocol driver
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix modules/pocketid/compat/qualification
      - name: Build the immutable native source and retain OCI provenance
        run: node modules/pocketid/compat/native-image.mjs build
      - name: Qualify the actual embedded binary and native protocol
        run: node modules/pocketid/compat/native-image.mjs qualify
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exactly the qualified native OCI output
        run: node modules/pocketid/compat/native-image.mjs publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: pocketid-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pocketid-native-${{ matrix.arch }}/source-receipt.json
            ${{ runner.temp }}/pocketid-native-${{ matrix.arch }}/qualification.json
            ${{ runner.temp }}/pocketid-native-${{ matrix.arch }}/publication.json
            ${{ runner.temp }}/pocketid-native-${{ matrix.arch }}/build-metadata.json
          if-no-files-found: error
          retention-days: 30

  pocketid-index:
    name: Publish qualified PocketID CAS index
    needs: pocketid-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: pocketid-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pocketid-native-receipts
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compose only both qualified immutable platform manifests
        id: image
        run: node modules/pocketid/compat/merge-native.mjs
      - name: Attest the exact qualified public index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/kombifyio/stackkits
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pocketid-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pocketid-publication.json
          if-no-files-found: error
          retention-days: 30
